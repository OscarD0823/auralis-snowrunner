name: Publicar aplicación para Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run check

      - name: Validar actualizaciones opcionales
        run: npm run test:updates

      - name: Validar iconos de vehículos
        run: npm run test:icons

      - name: Validar recuperación local sin modificar el juego
        run: npm run test:recovery

      - name: Crear instalador
        run: npm run make

      - name: Validar iconos incrustados y recurso de ventana
        run: node scripts/test-packaged-icons.mjs

      - name: Validar animación, partículas y disposición inicial
        run: node scripts/test-ui.mjs

      - name: Publicar archivos de actualización
        uses: softprops/action-gh-release@v3
        with:
          name: Auralis SnowRunner Studio ${{ github.ref_name }} · BETA
          generate_release_notes: true
          files: |
            out/make/squirrel.windows/x64/Auralis SnowRunner Studio Setup.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
